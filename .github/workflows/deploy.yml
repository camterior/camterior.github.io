name: 검사 후 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 브라우저로 4개 탭 열어보기
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/smoke.js
      - name: 배포할 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html admin.html sw.js manifest.webmanifest robots.txt .nojekyll img assets _site/
          mkdir _site/pack && cp -r pack/*.html pack/*.js pack/*.css pack/*.json pack/*.webmanifest pack/icons pack/img _site/pack/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub Pages가 가끔 방금 올린 파일을 못 찾음('No artifacts named github-pages') → 45초 뒤 한 번 더
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 배포 다시 시도 전 기다리기
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
